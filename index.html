<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Alenium</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #0f0f11;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* Minimalist Top Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: #18181b;
      border-bottom: 1px solid #27272a;
      z-index: 10;
    }
    .nav-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #a1a1aa;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      transition: background 0.15s, color 0.15s;
    }
    .btn-icon:hover {
      background: #27272a;
      color: #fafafa;
    }

    .search-box {
      flex: 1;
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      background: #0f0f11;
      border-radius: 8px;
      padding: 0 12px;
      height: 34px;
      border: 1px solid #27272a;
    }
    .search-box:focus-within {
      border-color: #3b82f6;
      background: #09090b;
    }
    .search-input {
      width: 100%;
      background: transparent;
      border: none;
      color: #fafafa;
      font-size: 0.85rem;
      outline: none;
    }

    /* Tab Bar */
    .tabs-bar {
      display: flex;
      align-items: center;
      background: #18181b;
      padding: 0 10px 6px 10px;
      gap: 6px;
      overflow-x: auto;
      border-bottom: 1px solid #27272a;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      height: 28px;
      background: #27272a;
      color: #a1a1aa;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      min-width: 120px;
      max-width: 200px;
    }
    .tab.active {
      background: #3f3f46;
      color: #fafafa;
      font-weight: 500;
    }
    .tab-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-close {
      border: none;
      background: transparent;
      color: #71717a;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 4px;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tab-close:hover { color: #fafafa; background: #52525b; }

    #viewsContainer { flex: 1; position: relative; background: #09090b; }
    webview { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
    webview.active { display: flex; }

    /* Modals */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-card {
      background: #18181b;
      border-radius: 12px;
      width: 440px;
      border: 1px solid #27272a;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal-card h3 { font-size: 1rem; color: #fafafa; }
    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }
    .setting-desc { color: #71717a; font-size: 0.75rem; margin-top: 2px; }
    select, input[type="text"] {
      background: #09090b;
      border: 1px solid #27272a;
      color: #fafafa;
      padding: 6px 10px;
      border-radius: 6px;
      outline: none;
      font-size: 0.85rem;
    }
    .btn-primary {
      background: #2563eb;
      border: none;
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-danger {
      background: #dc2626;
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="nav-group">
      <button class="btn-icon" id="btnBack">←</button>
      <button class="btn-icon" id="btnForward">→</button>
      <button class="btn-icon" id="btnReload">⟳</button>
    </div>

    <div class="search-box">
      <input type="text" class="search-input" id="omnibox" placeholder="Search or type a URL..." />
    </div>

    <div class="nav-group">
      <button class="btn-icon" id="btnNewTab" title="New Tab">+</button>
      <button class="btn-icon" id="btnSettings" title="Settings">⚙</button>
    </div>
  </div>

  <div class="tabs-bar" id="tabList"></div>
  <div id="viewsContainer"></div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-card">
      <h3>Browser Preferences</h3>

      <div class="setting-item">
        <div>
          <div>Search Engine</div>
          <div class="setting-desc">Default provider for search queries</div>
        </div>
        <select id="cfgEngine">
          <option value="brave">Brave</option>
          <option value="google">Google</option>
          <option value="duckduckgo">DuckDuckGo</option>
        </select>
      </div>

      <div class="setting-item">
        <div>
          <div>Homepage</div>
          <div class="setting-desc">URL opened on new tabs</div>
        </div>
        <input type="text" id="cfgHome" style="width:180px;" />
      </div>

      <div class="setting-item">
        <div>
          <div>AdShield & YouTube Auto-Skip</div>
          <div class="setting-desc">Block video ads and trackers</div>
        </div>
        <input type="checkbox" id="cfgAdblock" style="transform:scale(1.2); cursor:pointer;" />
      </div>

      <div class="setting-item">
        <div>
          <div>Clear Local Storage</div>
          <div class="setting-desc">Wipe all cached browser storage</div>
        </div>
        <button class="btn-danger" id="btnClearStorage">Clear Data</button>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:6px;">
        <button class="btn-primary" id="btnSaveSettings">Save</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tabList = document.getElementById('tabList');
      const viewsContainer = document.getElementById('viewsContainer');
      const omnibox = document.getElementById('omnibox');

      const btnNewTab = document.getElementById('btnNewTab');
      const btnBack = document.getElementById('btnBack');
      const btnForward = document.getElementById('btnForward');
      const btnReload = document.getElementById('btnReload');

      const btnSettings = document.getElementById('btnSettings');
      const settingsModal = document.getElementById('settingsModal');
      const btnSaveSettings = document.getElementById('btnSaveSettings');
      const btnClearStorage = document.getElementById('btnClearStorage');
      const cfgEngine = document.getElementById('cfgEngine');
      const cfgHome = document.getElementById('cfgHome');
      const cfgAdblock = document.getElementById('cfgAdblock');

      let tabs = [];
      let activeTabId = null;

      let config = {
        engine: localStorage.getItem('cfg_engine') || 'brave',
        home: localStorage.getItem('cfg_home') || 'https://search.brave.com',
        adblock: localStorage.getItem('cfg_adblock') !== 'false'
      };

      const engines = {
        brave: 'https://search.brave.com/search?q=',
        google: 'https://www.google.com/search?q=',
        duckduckgo: 'https://duckduckgo.com/?q='
      };

      function createTab(targetUrl = config.home) {
        const id = 'tab_' + Date.now();

        const tabEl = document.createElement('div');
        tabEl.className = 'tab';
        tabEl.innerHTML = `<span class="tab-title">New Tab</span><button class="tab-close">&times;</button>`;

        const wv = document.createElement('webview');
        wv.setAttribute('allowpopups', 'true');
        wv.setAttribute('useragent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36');
        wv.setAttribute('src', targetUrl);

        viewsContainer.appendChild(wv);
        tabList.appendChild(tabEl);
        tabs.push({ id, tabEl, wv });

        tabEl.onclick = (e) => {
          if (!e.target.classList.contains('tab-close')) selectTab(id);
        };
        tabEl.querySelector('.tab-close').onclick = (e) => {
          e.stopPropagation();
          closeTab(id);
        };

        wv.addEventListener('page-title-updated', (e) => {
          tabEl.querySelector('.tab-title').textContent = e.title;
        });

        wv.addEventListener('did-navigate', (e) => {
          if (activeTabId === id) omnibox.value = e.url;
        });

        wv.addEventListener('dom-ready', () => {
          if (config.adblock) {
            wv.insertCSS(`
              .adsbygoogle, [id^="google_ads_"], .ad-banner, .advertisement,
              ytd-ad-slot-renderer, ytd-banner-promo-renderer, #masthead-ad {
                display: none !important;
                visibility: hidden !important;
                height: 0 !important;
              }
            `);

            wv.executeJavaScript(`
              if (!window.__ytSkipShield) {
                window.__ytSkipShield = true;
                setInterval(() => {
                  const skipBtn = document.querySelector('.ytp-skip-ad-button, .ytp-ad-skip-button, .ytp-ad-skip-button-modern');
                  if (skipBtn) skipBtn.click();
                  
                  const adShowing = document.querySelector('.ad-showing, .ad-interrupting');
                  const video = document.querySelector('video');
                  if (adShowing && video) {
                    video.muted = true;
                    video.playbackRate = 16.0;
                    if (!isNaN(video.duration) && isFinite(video.duration)) {
                      video.currentTime = video.duration - 0.1;
                    }
                  }
                }, 150);
              }
            `);
          }
        });

        selectTab(id);
      }

      function selectTab(id) {
        activeTabId = id;
        tabs.forEach(t => {
          const match = t.id === id;
          t.tabEl.classList.toggle('active', match);
          t.wv.classList.toggle('active', match);
          if (match) omnibox.value = t.wv.getURL() || '';
        });
      }

      function closeTab(id) {
        if (tabs.length === 1) return;
        const idx = tabs.findIndex(t => t.id === id);
        tabs[idx].tabEl.remove();
        tabs[idx].wv.remove();
        tabs.splice(idx, 1);
        if (activeTabId === id) selectTab(tabs[Math.max(0, idx - 1)].id);
      }

      function getActiveWV() {
        const t = tabs.find(t => t.id === activeTabId);
        return t ? t.wv : null;
      }

      function navigate() {
        const input = omnibox.value.trim();
        const wv = getActiveWV();
        if (!input || !wv) return;

        const isUrl = input.includes('.') && !input.includes(' ') && !input.startsWith('http');
        if (input.startsWith('http://') || input.startsWith('https://')) {
          wv.loadURL(input);
        } else if (isUrl) {
          wv.loadURL('https://' + input);
        } else {
          wv.loadURL(engines[config.engine] + encodeURIComponent(input));
        }
      }

      btnNewTab.onclick = () => createTab();
      btnBack.onclick = () => { const wv = getActiveWV(); if (wv && wv.canGoBack()) wv.goBack(); };
      btnForward.onclick = () => { const wv = getActiveWV(); if (wv && wv.canGoForward()) wv.goForward(); };
      btnReload.onclick = () => { const wv = getActiveWV(); if (wv) wv.reload(); };

      omnibox.onkeydown = (e) => { if (e.key === 'Enter') navigate(); };

      btnSettings.onclick = () => {
        cfgEngine.value = config.engine;
        cfgHome.value = config.home;
        cfgAdblock.checked = config.adblock;
        settingsModal.style.display = 'flex';
      };

      btnSaveSettings.onclick = () => {
        config.engine = cfgEngine.value;
        config.home = cfgHome.value;
        config.adblock = cfgAdblock.checked;
        localStorage.setItem('cfg_engine', config.engine);
        localStorage.setItem('cfg_home', config.home);
        localStorage.setItem('cfg_adblock', config.adblock);
        settingsModal.style.display = 'none';
      };

      btnClearStorage.onclick = () => {
        localStorage.clear();
        alert('Local storage data cleared.');
      };

      window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 't') { e.preventDefault(); createTab(); }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'w') { e.preventDefault(); if (activeTabId) closeTab(activeTabId); }
      });

      createTab();
    });
  </script>
</body>
</html>
