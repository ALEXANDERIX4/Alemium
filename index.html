<!DOCTYPE html>
<html>
<head>
  <title>Alenium</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #1f1f1f;
      color: #e3e3e3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* Tab Strip */
    .tab-strip {
      display: flex;
      align-items: flex-end;
      height: 38px;
      background: #1f1f1f;
      padding: 0 10px;
      gap: 6px;
    }
    .app-icon {
      width: 18px;
      height: 18px;
      margin-bottom: 8px;
      margin-right: 4px;
    }
    .tab-list {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      overflow-x: auto;
      height: 100%;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      height: 32px;
      background: #2b2b2b;
      color: #aaa;
      border-radius: 8px 8px 0 0;
      font-size: 0.8rem;
      cursor: pointer;
      min-width: 140px;
      max-width: 200px;
    }
    .tab.active { background: #282a2d; color: #fff; }
    .tab-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tab-close {
      border: none; background: transparent; color: #aaa; font-size: 1rem;
      cursor: pointer; border-radius: 50%; width: 16px; height: 16px;
      display: flex; align-items: center; justify-content: center;
    }
    .tab-close:hover { background: #444; color: #fff; }
    
    .btn-new-tab {
      background: transparent; border: none; color: #aaa; font-size: 1.2rem;
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center; margin-bottom: 2px;
    }
    .btn-new-tab:hover { background: #333; color: #fff; }

    /* Navigation Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: #282a2d;
      border-bottom: 1px solid #1a1a1a;
    }
    .nav-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #c7c7c7;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
    }
    .nav-btn:hover { background: #3c4043; color: #fff; }

    /* Omnibox */
    .omnibox-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      background: #1f1f1f;
      border-radius: 20px;
      padding: 0 14px;
      height: 32px;
      border: 1px solid transparent;
    }
    .omnibox-wrapper:focus-within {
      background: #111;
      border-color: #8ab4f8;
    }
    .omnibox-input {
      width: 100%;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    #viewsContainer {
      flex: 1;
      position: relative;
      background: #111;
    }
    webview {
      position: absolute;
      width: 100%;
      height: 100%;
      display: none;
    }
    webview.active { display: flex; }

    /* Modals */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .panel {
      background: #282a2d;
      border-radius: 12px;
      width: 500px;
      max-height: 80vh;
      border: 1px solid #3c4043;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }
    .settings-input {
      background: #1f1f1f;
      border: 1px solid #3c4043;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      outline: none;
    }
    .btn-action {
      background: #8ab4f8;
      border: none;
      color: #1f1f1f;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-action:hover { background: #abc7fa; }
    .btn-danger { background: #ea4335; color: #fff; }

    .history-list {
      flex: 1;
      overflow-y: auto;
      max-height: 380px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .history-item {
      display: flex;
      flex-direction: column;
      padding: 8px 10px;
      background: #1f1f1f;
      border-radius: 6px;
      cursor: pointer;
    }
    .history-item:hover { background: #161719; }
    .history-title { font-size: 0.85rem; font-weight: 600; color: #fff; }
    .history-url { font-size: 0.75rem; color: #8ab4f8; }
  </style>
</head>
<body>

  <div class="tab-strip">
    <svg class="app-icon" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="21.5" fill="#1976D2"/>
      <circle cx="24" cy="24" r="7.5" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="6" fill="#1976D2"/>
    </svg>
    <div class="tab-list" id="tabList"></div>
    <button class="btn-new-tab" id="btnNewTab" title="New Tab (Ctrl+T)">+</button>
  </div>

  <div class="toolbar">
    <button class="nav-btn" id="btnBack">←</button>
    <button class="nav-btn" id="btnForward">→</button>
    <button class="nav-btn" id="btnReload">⟳</button>
    <button class="nav-btn" id="btnHome">🏠</button>

    <div class="omnibox-wrapper">
      <input type="text" class="omnibox-input" id="omnibox" placeholder="Search or enter URL" />
    </div>

    <button class="nav-btn" id="btnHistory" title="History (Ctrl+H)">🕒</button>
    <button class="nav-btn" id="btnDevTools" title="DevTools (F12)">🛠</button>
    <button class="nav-btn" id="btnSettings" title="Settings">⚙</button>
  </div>

  <div id="viewsContainer"></div>

  <!-- Settings Panel -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="panel">
      <h3>Alenium Settings</h3>
      <div class="settings-row">
        <label>Search Provider:</label>
        <select class="settings-input" id="cfgEngine">
          <option value="brave">Brave Search</option>
          <option value="google">Google</option>
          <option value="duckduckgo">DuckDuckGo</option>
        </select>
      </div>
      <div class="settings-row">
        <label>Home Page URL:</label>
        <input type="text" class="settings-input" id="cfgHome" style="width:220px;" />
      </div>
      <div class="settings-row">
        <label>AdShield & Auto-Skipper:</label>
        <input type="checkbox" id="cfgAdblock" style="transform: scale(1.3); cursor:pointer;" />
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:10px;">
        <button class="btn-action" id="btnSaveSettings">Save</button>
      </div>
    </div>
  </div>

  <!-- History Panel -->
  <div class="modal-backdrop" id="historyModal">
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>Browsing History</h3>
        <button class="btn-action btn-danger" id="btnClearHistory" style="padding:4px 8px; font-size:0.75rem;">Clear</button>
      </div>
      <div class="history-list" id="historyListContainer"></div>
      <div style="display:flex; justify-content:flex-end;">
        <button class="btn-action" id="btnCloseHistory">Close</button>
      </div>
    </div>
  </div>

  <script>
    // Core Elements
    const tabList = document.getElementById('tabList');
    const viewsContainer = document.getElementById('viewsContainer');
    const btnNewTab = document.getElementById('btnNewTab');
    const omnibox = document.getElementById('omnibox');
    const btnBack = document.getElementById('btnBack');
    const btnForward = document.getElementById('btnForward');
    const btnReload = document.getElementById('btnReload');
    const btnHome = document.getElementById('btnHome');
    const btnDevTools = document.getElementById('btnDevTools');

    // Modals
    const btnHistory = document.getElementById('btnHistory');
    const historyModal = document.getElementById('historyModal');
    const historyListContainer = document.getElementById('historyListContainer');
    const btnCloseHistory = document.getElementById('btnCloseHistory');
    const btnClearHistory = document.getElementById('btnClearHistory');

    const btnSettings = document.getElementById('btnSettings');
    const settingsModal = document.getElementById('settingsModal');
    const btnSaveSettings = document.getElementById('btnSaveSettings');
    const cfgEngine = document.getElementById('cfgEngine');
    const cfgHome = document.getElementById('cfgHome');
    const cfgAdblock = document.getElementById('cfgAdblock');

    let tabs = [];
    let activeTabId = null;

    let config = {
      engine: localStorage.getItem('cfg_engine') || 'brave',
      home: localStorage.getItem('cfg_home') || 'https://search.brave.com',
      adblock: localStorage.getItem('cfg_adblock') !== 'false'
    };

    const engines = {
      brave: 'https://search.brave.com/search?q=',
      google: 'https://www.google.com/search?q=',
      duckduckgo: 'https://duckduckgo.com/?q='
    };

    function addHistory(title, url) {
      if (!url || url.startsWith('data:') || url.startsWith('about:')) return;
      let history = JSON.parse(localStorage.getItem('browser_history') || '[]');
      if (history.length > 0 && history[0].url === url) return;

      history.unshift({
        title: title || url,
        url: url,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
      if (history.length > 100) history.pop();
      localStorage.setItem('browser_history', JSON.stringify(history));
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('browser_history') || '[]');
      historyListContainer.innerHTML = '';

      if (history.length === 0) {
        historyListContainer.innerHTML = '<div style="color:#777; text-align:center; padding:20px;">No history</div>';
        return;
      }

      history.forEach(item => {
        const row = document.createElement('div');
        row.className = 'history-item';
        row.innerHTML = `<div class="history-title">${item.title}</div><div class="history-url">${item.url}</div>`;
        row.onclick = () => { createTab(item.url); historyModal.style.display = 'none'; };
        historyListContainer.appendChild(row);
      });
    }

    function createTab(targetUrl = config.home) {
      const id = Date.now().toString();

      const tabEl = document.createElement('div');
      tabEl.className = 'tab';
      tabEl.id = `tab-${id}`;
      tabEl.innerHTML = `<span class="tab-title">New Tab</span><button class="tab-close">&times;</button>`;

      const wv = document.createElement('webview');
      wv.id = `wv-${id}`;
      wv.setAttribute('allowpopups', 'true');
      wv.src = targetUrl;

      viewsContainer.appendChild(wv);
      tabList.appendChild(tabEl);
      tabs.push({ id, tabEl, wv });

      tabEl.onclick = (e) => { if (!e.target.classList.contains('tab-close')) selectTab(id); };
      tabEl.querySelector('.tab-close').onclick = (e) => { e.stopPropagation(); closeTab(id); };

      wv.addEventListener('page-title-updated', (e) => {
        tabEl.querySelector('.tab-title').textContent = e.title;
        addHistory(e.title, wv.getURL());
      });

      wv.addEventListener('did-navigate', (e) => {
        if (activeTabId === id) omnibox.value = e.url;
        addHistory(wv.getTitle(), e.url);
      });

      wv.addEventListener('dom-ready', () => {
        if (config.adblock) {
          wv.insertCSS('.adsbygoogle, [id^="google_ads_"], .ad-banner, ytd-ad-slot-renderer { display: none !important; }');
          wv.executeJavaScript(`
            setInterval(() => {
              const skip = document.querySelector('.ytp-skip-ad-button, .ytp-ad-skip-button, .ytp-ad-skip-button-modern');
              if (skip) skip.click();
              const ad = document.querySelector('.ad-showing, .ad-interrupting');
              const vid = document.querySelector('video');
              if (ad && vid && !isNaN(vid.duration)) {
                vid.muted = true;
                vid.playbackRate = 16.0;
                vid.currentTime = vid.duration - 0.1;
              }
            }, 250);
          `);
        }
      });

      selectTab(id);
    }

    function selectTab(id) {
      activeTabId = id;
      tabs.forEach(t => {
        const isMatch = t.id === id;
        t.tabEl.classList.toggle('active', isMatch);
        t.wv.classList.toggle('active', isMatch);
        if (isMatch) omnibox.value = t.wv.getURL() || '';
      });
    }

    function closeTab(id) {
      if (tabs.length === 1) return;
      const idx = tabs.findIndex(t => t.id === id);
      tabs[idx].tabEl.remove();
      tabs[idx].wv.remove();
      tabs.splice(idx, 1);
      if (activeTabId === id) selectTab(tabs[Math.max(0, idx - 1)].id);
    }

    function getActiveWV() {
      const active = tabs.find(t => t.id === activeTabId);
      return active ? active.wv : null;
    }

    function navigate() {
      const input = omnibox.value.trim();
      const wv = getActiveWV();
      if (!input || !wv) return;

      const isUrl = input.includes('.') && !input.includes(' ') && !input.startsWith('http');
      if (input.startsWith('http://') || input.startsWith('https://')) {
        wv.loadURL(input);
      } else if (isUrl) {
        wv.loadURL('https://' + input);
      } else {
        wv.loadURL(engines[config.engine] + encodeURIComponent(input));
      }
    }

    btnNewTab.onclick = () => createTab();
    btnBack.onclick = () => { const wv = getActiveWV(); if (wv && wv.canGoBack()) wv.goBack(); };
    btnForward.onclick = () => { const wv = getActiveWV(); if (wv && wv.canGoForward()) wv.goForward(); };
    btnReload.onclick = () => { const wv = getActiveWV(); if (wv) wv.reload(); };
    btnHome.onclick = () => { const wv = getActiveWV(); if (wv) wv.loadURL(config.home); };
    btnDevTools.onclick = () => {
      const wv = getActiveWV();
      if (wv) wv.isDevToolsOpened() ? wv.closeDevTools() : wv.openDevTools();
    };

    omnibox.onkeydown = (e) => { if (e.key === 'Enter') navigate(); };

    btnHistory.onclick = () => { renderHistory(); historyModal.style.display = 'flex'; };
    btnCloseHistory.onclick = () => { historyModal.style.display = 'none'; };
    btnClearHistory.onclick = () => { localStorage.removeItem('browser_history'); renderHistory(); };

    btnSettings.onclick = () => {
      cfgEngine.value = config.engine;
      cfgHome.value = config.home;
      cfgAdblock.checked = config.adblock;
      settingsModal.style.display = 'flex';
    };

    btnSaveSettings.onclick = () => {
      config.engine = cfgEngine.value;
      config.home = cfgHome.value;
      config.adblock = cfgAdblock.checked;
      localStorage.setItem('cfg_engine', config.engine);
      localStorage.setItem('cfg_home', config.home);
      localStorage.setItem('cfg_adblock', config.adblock);
      settingsModal.style.display = 'none';
    };

    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key.toLowerCase() === 't') { e.preventDefault(); createTab(); }
      if (e.ctrlKey && e.key.toLowerCase() === 'w') { e.preventDefault(); if (activeTabId) closeTab(activeTabId); }
      if (e.ctrlKey && e.key.toLowerCase() === 'h') { e.preventDefault(); btnHistory.click(); }
      if (e.key === 'F12') btnDevTools.click();
    });

    createTab();
  </script>
</body>
</html>
