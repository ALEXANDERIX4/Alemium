<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Alenium</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #0f0f11;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: #18181b;
      border-bottom: 1px solid #27272a;
      height: 44px;
    }
    .nav-group { display: flex; align-items: center; gap: 4px; }
    .btn-icon {
      width: 30px; height: 30px; border-radius: 6px; border: none;
      background: transparent; color: #a1a1aa; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 0.95rem;
    }
    .btn-icon:hover { background: #27272a; color: #fafafa; }

    .search-box {
      flex: 1; max-width: 680px; margin: 0 auto; display: flex;
      align-items: center; background: #0f0f11; border-radius: 8px;
      padding: 0 12px; height: 30px; border: 1px solid #27272a;
    }
    .search-box:focus-within { border-color: #3b82f6; background: #09090b; }
    .search-input {
      width: 100%; background: transparent; border: none;
      color: #fafafa; font-size: 0.85rem; outline: none;
    }

    .tabs-bar {
      display: flex; align-items: center; background: #18181b;
      padding: 0 10px 4px 10px; gap: 6px; overflow-x: auto;
      border-bottom: 1px solid #27272a; height: 34px;
    }
    .tab {
      display: flex; align-items: center; gap: 8px; padding: 4px 10px;
      height: 26px; background: #27272a; color: #a1a1aa; border-radius: 6px;
      font-size: 0.78rem; cursor: pointer; min-width: 120px; max-width: 180px;
    }
    .tab.active { background: #3f3f46; color: #fafafa; font-weight: 500; }
    .tab-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tab-close {
      border: none; background: transparent; color: #71717a; font-size: 0.85rem;
      cursor: pointer; width: 14px; height: 14px; display: flex;
      align-items: center; justify-content: center;
    }
    .tab-close:hover { color: #fff; }
  </style>
</head>
<body>

  <div class="header">
    <div class="nav-group">
      <button class="btn-icon" id="btnBack">←</button>
      <button class="btn-icon" id="btnForward">→</button>
      <button class="btn-icon" id="btnReload">⟳</button>
    </div>

    <div class="search-box">
      <input type="text" class="search-input" id="omnibox" placeholder="Search or type a URL..." />
    </div>

    <div class="nav-group">
      <button class="btn-icon" id="btnDark" title="Toggle Universal Dark Mode">🌙</button>
      <button class="btn-icon" id="btnNewTab" title="New Tab">+</button>
    </div>
  </div>

  <div class="tabs-bar" id="tabList"></div>

  <script>
    const { ipcRenderer } = require('electron');

    const tabList = document.getElementById('tabList');
    const omnibox = document.getElementById('omnibox');
    const btnNewTab = document.getElementById('btnNewTab');
    const btnBack = document.getElementById('btnBack');
    const btnForward = document.getElementById('btnForward');
    const btnReload = document.getElementById('btnReload');
    const btnDark = document.getElementById('btnDark');

    let tabs = [];
    let activeTabId = null;
    let darkMode = true;

    function createTab(url = 'https://search.brave.com') {
      const id = 'tab_' + Date.now();

      const tabEl = document.createElement('div');
      tabEl.className = 'tab';
      tabEl.innerHTML = `<span class="tab-title">New Tab</span><button class="tab-close">&times;</button>`;

      tabList.appendChild(tabEl);
      tabs.push({ id, tabEl });

      tabEl.onclick = (e) => {
        if (!e.target.classList.contains('tab-close')) selectTab(id);
      };
      tabEl.querySelector('.tab-close').onclick = (e) => {
        e.stopPropagation();
        closeTab(id);
      };

      ipcRenderer.send('create-tab', { id, url });
      selectTab(id);
    }

    function selectTab(id) {
      activeTabId = id;
      tabs.forEach(t => {
        t.tabEl.classList.toggle('active', t.id === id);
      });
      ipcRenderer.send('switch-tab', id);
    }

    function closeTab(id) {
      if (tabs.length === 1) return;
      const idx = tabs.findIndex(t => t.id === id);
      tabs[idx].tabEl.remove();
      tabs.splice(idx, 1);
      ipcRenderer.send('close-tab', id);

      if (activeTabId === id) {
        selectTab(tabs[Math.max(0, idx - 1)].id);
      }
    }

    function navigate() {
      let input = omnibox.value.trim();
      if (!input) return;

      const isUrl = input.includes('.') && !input.includes(' ') && !input.startsWith('http');
      let finalUrl = input;
      if (input.startsWith('http://') || input.startsWith('https://')) {
        finalUrl = input;
      } else if (isUrl) {
        finalUrl = 'https://' + input;
      } else {
        finalUrl = 'https://search.brave.com/search?q=' + encodeURIComponent(input);
      }

      ipcRenderer.send('navigate-active', finalUrl);
    }

    btnNewTab.onclick = () => createTab();
    btnBack.onclick = () => ipcRenderer.send('nav-back');
    btnForward.onclick = () => ipcRenderer.send('nav-forward');
    btnReload.onclick = () => ipcRenderer.send('nav-reload');
    omnibox.onkeydown = (e) => { if (e.key === 'Enter') navigate(); };

    btnDark.onclick = () => {
      darkMode = !darkMode;
      btnDark.style.opacity = darkMode ? '1' : '0.4';
      ipcRenderer.send('toggle-dark-mode', darkMode);
    };

    ipcRenderer.on('url-changed', (event, { id, url }) => {
      if (activeTabId === id) omnibox.value = url;
    });

    ipcRenderer.on('title-changed', (event, { id, title }) => {
      const target = tabs.find(t => t.id === id);
      if (target) {
        target.tabEl.querySelector('.tab-title').textContent = title;
      }
    });

    createTab();
  </script>
</body>
</html>
