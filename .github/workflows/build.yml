name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download Chromium App Icon
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/alrra/browser-logos/main/src/chromium/chromium.ico" -OutFile "icon.ico"
      - run: npm install
      - run: npm run dist
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Alenium-Browser-Setup
          path: dist/*.exe
