<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Alenium</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #1f1f1f;
      color: #e3e3e3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .chrome-tab-strip {
      display: flex;
      align-items: flex-end;
      height: 38px;
      background: #161719;
      padding: 0 10px;
      gap: 6px;
    }
    .app-brand-icon {
      width: 18px;
      height: 18px;
      margin-bottom: 8px;
      margin-right: 4px;
    }
    .tab-list {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      overflow-x: auto;
      height: 100%;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      height: 32px;
      background: #2b2b2b;
      color: #aaa;
      border-radius: 8px 8px 0 0;
      font-size: 0.8rem;
      cursor: pointer;
      min-width: 140px;
      max-width: 200px;
    }
    .tab.active { background: #1f1f1f; color: #fff; }
    .tab-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tab-close {
      border: none; background: transparent; color: #aaa; font-size: 1rem;
      cursor: pointer; border-radius: 50%; width: 16px; height: 16px;
      display: flex; align-items: center; justify-content: center;
    }
    .tab-close:hover { background: #444; color: #fff; }
    
    .btn-new-tab {
      background: transparent; border: none; color: #aaa; font-size: 1.2rem;
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center; margin-bottom: 2px;
    }
    .btn-new-tab:hover { background: #333; color: #fff; }

    .chrome-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: #1f1f1f;
      height: 45px;
      border-bottom: 1px solid #161719;
    }
    .nav-btn {
      width: 28px; height: 28px; border-radius: 50%; border: none;
      background: transparent; color: #c7c7c7; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 0.95rem;
    }
    .nav-btn:hover { background: #3c4043; color: #fff; }

    .omnibox-wrapper {
      flex: 1; display: flex; align-items: center; background: #161719;
      border-radius: 20px; padding: 0 14px; height: 32px; border: 1px solid transparent;
    }
    .omnibox-wrapper:focus-within { background: #111; border-color: #8ab4f8; }
    .omnibox-input { width: 100%; background: transparent; border: none; color: #fff; font-size: 0.85rem; outline: none; }

    /* The native WebContentsView will paint over this area automatically */
    #viewsContainer { flex: 1; background: #1f1f1f; }

    .modal-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      z-index: 1000; justify-content: center; align-items: center;
    }
    .panel {
      background: #1f1f1f; border-radius: 12px; width: 480px; border: 1px solid #3c4043;
      padding: 22px; display: flex; flex-direction: column; gap: 14px;
    }
    .settings-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
    .settings-desc { font-size: 0.75rem; color: #888; }
    .settings-input { background: #161719; border: 1px solid #3c4043; color: #fff; padding: 6px 10px; border-radius: 6px; outline: none; }
    .btn-action { background: #8ab4f8; border: none; color: #1f1f1f; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-danger { background: #ea4335; color: #fff; }
    .history-list { max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .history-item { padding: 8px 10px; background: #161719; border-radius: 6px; cursor: pointer; }
    .history-item:hover { background: #282a2d; }
    .history-title { font-size: 0.85rem; font-weight: bold; }
    .history-url { font-size: 0.75rem; color: #8ab4f8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>

  <div class="chrome-tab-strip">
    <svg class="app-brand-icon" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="21.5" fill="#1976D2"/>
      <circle cx="24" cy="24" r="7.5" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="6" fill="#1976D2"/>
    </svg>
    <div class="tab-list" id="tabList"></div>
    <button class="btn-new-tab" id="btnNewTab" title="New Tab">+</button>
  </div>

  <div class="chrome-toolbar">
    <button class="nav-btn" id="btnBack">←</button>
    <button class="nav-btn" id="btnForward">→</button>
    <button class="nav-btn" id="btnReload">⟳</button>
    <button class="nav-btn" id="btnHome">🏠</button>
    <div class="omnibox-wrapper"><input type="text" class="omnibox-input" id="omnibox" placeholder="Search or type URL" /></div>
    <button class="nav-btn" id="btnHistory">🕒</button>
    <button class="nav-btn" id="btnSettings">⚙</button>
  </div>

  <div id="viewsContainer"></div>

  <!-- Settings Modal -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="panel">
      <h3>Browser Settings</h3>
      <div class="settings-row">
        <div><div>Search Engine</div><div class="settings-desc">Provider for omnibox</div></div>
        <select class="settings-input" id="cfgEngine">
          <option value="brave">Brave</option>
          <option value="google">Google</option>
          <option value="duckduckgo">DuckDuckGo</option>
        </select>
      </div>
      <div class="settings-row">
        <div><div>Home URL</div><div class="settings-desc">Default landing page</div></div>
        <input type="text" class="settings-input" id="cfgHome" style="width:200px;" />
      </div>
      <div class="settings-row">
        <div><div>Clear Storage</div><div class="settings-desc">Wipe all local data</div></div>
        <button class="btn-action btn-danger" id="btnClearStorage">Clear Data</button>
      </div>
      <div style="display:flex; justify-content:flex-end; margin-top:8px;">
        <button class="btn-action" id="btnSaveSettings">Save</button>
      </div>
    </div>
  </div>

  <!-- History Modal -->
  <div class="modal-backdrop" id="historyModal">
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>History</h3>
        <button class="btn-action btn-danger" id="btnClearHistory" style="padding: 4px 8px; font-size:0.75rem;">Clear</button>
      </div>
      <div class="history-list" id="historyListContainer"></div>
      <div style="display:flex; justify-content:flex-end;">
        <button class="btn-action" id="btnCloseHistory">Close</button>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    let tabs = [];
    let activeTabId = null;

    let config = {
      engine: localStorage.getItem('cfg_engine') || 'brave',
      home: localStorage.getItem('cfg_home') || 'https://search.brave.com'
    };

    const engines = {
      brave: 'https://search.brave.com/search?q=',
      google: 'https://www.google.com/search?q=',
      duckduckgo: 'https://duckduckgo.com/?q='
    };

    function openModal(modalId) {
      document.getElementById(modalId).style.display = 'flex';
      ipcRenderer.send('toggle-ui-overlay', true); // Hides webview so you can see modal
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
      ipcRenderer.send('toggle-ui-overlay', false); // Restores webview
    }

    function createTab(targetUrl = config.home) {
      const id = 'tab_' + Date.now();
      const tabEl = document.createElement('div');
      tabEl.className = 'tab';
      tabEl.innerHTML = `<span class="tab-title">New Tab</span><button class="tab-close">&times;</button>`;
      
      document.getElementById('tabList').appendChild(tabEl);
      tabs.push({ id, tabEl, url: targetUrl });
      
      tabEl.onclick = (e) => { if (!e.target.classList.contains('tab-close')) selectTab(id); };
      tabEl.querySelector('.tab-close').onclick = (e) => { e.stopPropagation(); closeTab(id); };

      ipcRenderer.send('create-tab', id, targetUrl);
      selectTab(id);
    }

    function selectTab(id) {
      activeTabId = id;
      tabs.forEach(t => { t.tabEl.classList.toggle('active', t.id === id); });
      const currentTab = tabs.find(t => t.id === id);
      document.getElementById('omnibox').value = currentTab ? currentTab.url : '';
      ipcRenderer.send('switch-tab', id);
    }

    function closeTab(id) {
      if (tabs.length === 1) return;
      const idx = tabs.findIndex(t => t.id === id);
      tabs[idx].tabEl.remove();
      tabs.splice(idx, 1);
      ipcRenderer.send('close-tab', id);
      if (activeTabId === id) selectTab(tabs[Math.max(0, idx - 1)].id);
    }

    function navigate() {
      const input = document.getElementById('omnibox').value.trim();
      if (!input || !activeTabId) return;
      const isUrl = input.includes('.') && !input.includes(' ') && !input.startsWith('http');
      const finalUrl = input.startsWith('http') ? input : (isUrl ? 'https://' + input : engines[config.engine] + encodeURIComponent(input));
      ipcRenderer.send('navigate-tab', activeTabId, finalUrl);
    }

    // Backend listeners updating the UI
    ipcRenderer.on('url-changed', (e, id, url) => {
      const t = tabs.find(x => x.id === id);
      if (t) t.url = url;
      if (activeTabId === id) document.getElementById('omnibox').value = url;
    });

    ipcRenderer.on('title-changed', (e, id, title) => {
      const t = tabs.find(x => x.id === id);
      if (t) t.tabEl.querySelector('.tab-title').textContent = title;
    });

    // UI Buttons
    document.getElementById('btnNewTab').onclick = () => createTab();
    document.getElementById('btnBack').onclick = () => ipcRenderer.send('nav-action', activeTabId, 'back');
    document.getElementById('btnForward').onclick = () => ipcRenderer.send('nav-action', activeTabId, 'forward');
    document.getElementById('btnReload').onclick = () => ipcRenderer.send('nav-action', activeTabId, 'reload');
    document.getElementById('btnHome').onclick = () => ipcRenderer.send('navigate-tab', activeTabId, config.home);
    document.getElementById('omnibox').onkeydown = (e) => { if (e.key === 'Enter') navigate(); };

    // Modals
    document.getElementById('btnSettings').onclick = () => {
      document.getElementById('cfgEngine').value = config.engine;
      document.getElementById('cfgHome').value = config.home;
      openModal('settingsModal');
    };
    document.getElementById('btnSaveSettings').onclick = () => {
      config.engine = document.getElementById('cfgEngine').value;
      config.home = document.getElementById('cfgHome').value;
      localStorage.setItem('cfg_engine', config.engine);
      localStorage.setItem('cfg_home', config.home);
      closeModal('settingsModal');
    };
    
    document.getElementById('btnHistory').onclick = () => openModal('historyModal');
    document.getElementById('btnCloseHistory').onclick = () => closeModal('historyModal');
    document.getElementById('btnClearStorage').onclick = () => { localStorage.clear(); alert('Data Cleared.'); };

    createTab();
  </script>
</body>
</html>
